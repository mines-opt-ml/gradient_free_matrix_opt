[project]
name = "zoom"
version = "0.1.0"
description = "Gradient-free methods for matrix function optimization"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asttokens==2.4.1",
    "colorama==0.4.6",
    "comm==0.2.2",
    "contourpy==1.2.1",
    "cycler==0.12.1",
    "debugpy==1.8.5",
    "decorator==5.1.1",
    "executing==2.0.1",
    "fonttools==4.53.0",
    "iniconfig==2.1.0",
    "ipykernel==6.29.5",
    "ipython==8.26.0",
    "jax==0.8.2",
    "jaxlib==0.8.2",
    "jedi==0.19.1",
    "jupyter-client==8.6.2",
    "jupyter-core==5.7.2",
    "kiwisolver==1.4.5",
    "matplotlib==3.9.4",
    "matplotlib-inline==0.1.7",
    "ml-dtypes==0.5.0",
    "nest-asyncio==1.6.0",
    "numpy==2.2.6",
    "opt-einsum==3.4.0",
    "packaging==24.0",
    "pandas>=2.3.3",
    "parso==0.8.4",
    "pillow==11.3.0",
    "platformdirs==4.2.2",
    "pluggy==1.6.0",
    "prompt-toolkit==3.0.47",
    "psutil==6.0.0",
    "pure-eval==0.2.3",
    "pygments==2.19.2",
    "pyparsing==3.1.2",
    "pytest==8.4.1",
    "python-dateutil==2.9.0.post0",
    "pywin32==306; sys_platform == 'win32'",
    "pyzmq==26.1.1",
    "scipy==1.14.1",
    "setuptools==80.9.0",
    "six==1.16.0",
    "stack-data==0.6.3",
    "tornado==6.4.1",
    "traitlets==5.14.3",
    "wcwidth==0.2.13",
    "wheel==0.45.1",
]

[tool.pytest.ini_options]
# the top-level modules (base_optimizer, obj_func, recovery) live at the
# repository root rather than in an installed package, so put the root on
# sys.path for test collection.
pythonpath = ["."]
testpaths = ["tests"]
